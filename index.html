<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Ollama Multi-modal Image Describer</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <p class="eyebrow">IMAGE TOOL</p>
        <h1>Ollama Multi-modal Image Describer</h1>
      </header>

      <section class="workspace" aria-label="Image description">
        <div class="controls">
          <label class="file-button" for="image-input">Select Images</label>
          <input id="image-input" class="visually-hidden" type="file" accept="image/*" multiple>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>

        <div class="content-grid">
          <section class="panel" aria-labelledby="preview-title">
            <h2 id="preview-title">Selected Images</h2>
            <div class="image-grid">
              <div class="image-slot">
                <h3>Image 1</h3>
                <div class="preview" aria-live="polite">
                  <p id="empty-preview-1" class="empty-state">Select an image to preview</p>
                  <img id="preview-image-1" alt="Preview of selected image 1" hidden>
                </div>
              </div>
              <div class="image-slot">
                <h3>Image 2</h3>
                <div class="preview" aria-live="polite">
                  <p id="empty-preview-2" class="empty-state">Select a second image to preview</p>
                  <img id="preview-image-2" alt="Preview of selected image 2" hidden>
                </div>
              </div>
            </div>
          </section>

          <div class="describe-row">
            <button id="describe-button" class="describe-button" type="button">Describe Selected Images</button>
          </div>

          <section class="panel response-panel" aria-labelledby="response-title">
            <h2 id="response-title">LLM Responses</h2>
            <div class="response-grid">
              <section class="response-card" aria-labelledby="response-image-1-title">
                <h3 id="response-image-1-title">Image 1 Description</h3>
                <div id="description-1" class="description" aria-live="polite"></div>
              </section>
              <section class="response-card" aria-labelledby="response-image-2-title">
                <h3 id="response-image-2-title">Image 2 Description</h3>
                <div id="description-2" class="description" aria-live="polite"></div>
              </section>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
